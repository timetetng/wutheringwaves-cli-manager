name: Code Quality

# 主线和开发分支均运行质量检查与离线测试
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-format:
    name: Ruff & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install ruff -e .

      # 1. 代码审查 (Lint)
      # 检查是否有错误，如果有则流水线失败
      - name: Run Ruff Linter
        run: ruff check . --output-format=github

      # 2. 格式检查 (Format)
      # --check 参数表示只检查不修改。如果代码未格式化，流水线会失败
      - name: Check Code Formatting
        run: ruff format --check .

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
