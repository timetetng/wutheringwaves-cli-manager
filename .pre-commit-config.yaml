repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace   # 删除行尾多余空格
      - id: end-of-file-fixer     # 确保文件以空行结尾
      - id: check-yaml            # 检查 yaml 文件语法
      - id: check-added-large-files # 防止意外提交大文件

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      # 1. 代码审查 (Lint)
      - id: ruff
        args: [ --fix ]

      # 2. 格式化 (Format)
      - id: ruff-format

  # 本地 hook：commit 时自动同步 pyproject.toml 版本号到中英文 README 徽章
  - repo: local
    hooks:
      - id: sync-version-badges
        name: sync-version-badges
        entry: python scripts/sync_version.py
        language: python
        pass_filenames: false
        always_run: true
